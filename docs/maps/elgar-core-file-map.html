  <script>
    const data = JSON.parse(document.getElementById('map-data').textContent); const app = document.getElementById('app'); const search = document.getElementById('search'); const categoryFilter = document.getElementById('category'); const rawFilter = document.getElementById('raw');
    for (const group of data.groups) { const option = document.createElement('option'); option.value = group.category; option.textContent = group.category; categoryFilter.append(option); }
    function section(title, note) { const wrap = document.createElement('section'); wrap.className = 'section'; const head = document.createElement('div'); head.className = 'section-head'; const h = document.createElement('h2'); h.textContent = title; const p = document.createElement('p'); p.className = 'section-note'; p.textContent = note; head.append(h, p); wrap.append(head); app.append(wrap); return wrap; }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function pill(text, cls = '') { return '<span class="pill ' + cls + '">' + escapeHtml(text) + '</span>'; }
    function render() {
      app.textContent = ''; const q = search.value.trim().toLowerCase(); const cat = categoryFilter.value; const raw = rawFilter.value;
      const filtered = data.files.filter(file => { const blob = JSON.stringify(file).toLowerCase(); const rawValue = file.needed_for_raw_chat.toLowerCase(); return (!q || blob.includes(q)) && (!cat || file.category === cat) && (!raw || rawValue.startsWith(raw)); });
      const stats = section('Inventory', data.note); const statGrid = document.createElement('div'); statGrid.className = 'stats'; const statItems = [['Shown files', filtered.length], ['Total files', data.counts.total_files], ['Rust files', data.counts.rust_files], ['Top-level Rust', data.counts.top_level_rust_files], ['Public modules', data.counts.public_top_level_modules], ['Private modules', data.counts.private_top_level_modules]];
      for (const [label, value] of statItems) { const div = document.createElement('div'); div.className = 'stat'; div.innerHTML = '<b>' + value + '</b><span>' + label + '</span>'; statGrid.append(div); } stats.append(statGrid);
      for (const flow of data.flows) { const wrap = section(flow.title, 'High-level path through core.'); const grid = document.createElement('div'); grid.className = 'flow-grid'; flow.steps.forEach((step, index) => { const card = document.createElement('div'); card.className = 'step'; card.innerHTML = '<div class="step-title">Step ' + (index + 1) + '</div><div class="mono small">' + escapeHtml(step) + '</div>'; grid.append(card); }); wrap.append(grid); }
      const groups = section('Categories', 'Current responsibility groups. These are labels for review, not final folders.'); const groupGrid = document.createElement('div'); groupGrid.className = 'group-grid'; for (const group of data.groups) { const card = document.createElement('div'); card.className = 'group-card'; const count = data.files.filter(f => f.category === group.category).length; card.innerHTML = '<h3>' + escapeHtml(group.category) + '</h3><div class="small">' + count + ' files</div><p class="small">' + escapeHtml(group.note) + '</p>'; groupGrid.append(card); } groups.append(groupGrid);
      const edges = section('Connection Map', 'Main file-to-file relationships to review before moving files.'); const edgeList = document.createElement('div'); edgeList.className = 'edge-list'; for (const [from, to, why] of data.edges) { const row = document.createElement('div'); row.className = 'edge'; row.innerHTML = '<div class="mono">' + escapeHtml(from) + '</div><div class="arrow">→</div><div class="mono">' + escapeHtml(to) + '</div><div>' + escapeHtml(why) + '</div>'; edgeList.append(row); } edges.append(edgeList);
      const filesSection = section('Files', 'Every current file under crates/elgar-core/src.'); const grid = document.createElement('div'); grid.className = 'group-grid';
      for (const file of filtered) { const card = document.createElement('article'); card.className = 'file-card'; card.dataset.status = file.status; card.dataset.category = file.category; card.dataset.raw = file.needed_for_raw_chat.toLowerCase().startsWith('yes') ? 'yes' : 'no'; const surfaceClass = file.surface.includes('public') ? 'public' : file.surface === 'test' ? 'test' : file.category === 'compat-controller' ? 'compat' : ''; const imports = file.imports.length ? file.imports.slice(0, 8).join(', ') + (file.imports.length > 8 ? ' +' + (file.imports.length - 8) : '') : 'none detected'; const importedBy = file.imported_by.length ? file.imported_by.slice(0, 8).join(', ') + (file.imported_by.length > 8 ? ' +' + (file.imported_by.length - 8) : '') : 'none detected'; card.innerHTML = '<div class="file-name">' + escapeHtml(file.file) + '</div><div class="pills">' + pill(file.category) + pill(file.status) + pill(file.surface, surfaceClass) + pill('raw: ' + file.needed_for_raw_chat, file.needed_for_raw_chat === 'yes' ? 'raw' : '') + '</div><div>' + escapeHtml(file.purpose) + '</div><div class="meta-grid"><div class="meta"><b>Lines:</b> ' + file.lines + '</div><div class="meta"><b>Module:</b> ' + escapeHtml(file.module || 'none') + '</div><div class="meta"><b>TUI:</b> ' + escapeHtml(file.needed_for_tui) + '</div><div class="meta"><b>Full agent:</b> ' + escapeHtml(file.needed_for_full_agent) + '</div><div class="meta"><b>Move:</b> ' + escapeHtml(file.safe_to_move) + '</div><div class="meta"><b>Delete:</b> ' + escapeHtml(file.safe_to_delete) + '</div></div><div class="small"><b>Imports:</b> ' + escapeHtml(imports) + '</div><div class="small"><b>Imported by:</b> ' + escapeHtml(importedBy) + '</div>'; grid.append(card); }
      filesSection.append(grid);
    }
    search.addEventListener('input', render); categoryFilter.addEventListener('change', render); rawFilter.addEventListener('change', render); render();
  </script>
