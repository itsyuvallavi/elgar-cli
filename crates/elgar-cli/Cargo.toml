[package]
name = "elgar-cli"
version = "0.10.0"
edition = "2021"

[[bin]]
name = "elgar"
path = "src/main.rs"

[dependencies]
elgar-core = { path = "../elgar-core" }
elgar-tui = { path = "../elgar-tui" }
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
